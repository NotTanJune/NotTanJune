name: Refresh profile

on:
  schedule:
    - cron: "0 19 * * *" # 03:00 Singapore time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman

      - name: Move Pac-Man SVGs into the repo
        run: |
          mkdir -p pacman
          cp dist/pacman-contribution-graph.svg dist/pacman-contribution-graph-dark.svg pacman/

      - name: Update recently shipped
        run: python3 scripts/update_recent.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A README.md pacman
          if git commit -m "chore: refresh profile"; then
            git push
          fi
